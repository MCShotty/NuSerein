name: Windows installer for merged NuSerein
run-name: Windows x64 installer for ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Native CI run for the merged source commit
        required: true
      source_commit:
        description: Exact merged source commit
        required: true

permissions:
  contents: read
  actions: read

jobs:
  fixture-probe:
    if: inputs.run_id == '0'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Run the installer fixture with a static synthetic process
        run: |
          $source = Get-Content -Raw packaging/windows/test_installer.py
          $before = '["rustc", "--edition=2024", "-O", str(fixture), "-o", str(payload / "serein.exe")]'
          $after = '["rustc", "--edition=2024", "-C", "target-feature=+crt-static", "-O", str(fixture), "-o", str(payload / "serein.exe")]'
          if (-not $source.Contains($before) -or $source.IndexOf($before) -ne $source.LastIndexOf($before)) { throw 'Installer fixture source changed unexpectedly' }
          $fixture = 'packaging/windows/installer-static-fixture.py'
          try {
            [IO.File]::WriteAllText((Join-Path (Get-Location) $fixture), $source.Replace($before, $after), [Text.UTF8Encoding]::new($false))
            python $fixture
            if ($LASTEXITCODE -ne 0) { throw 'Windows installer fixtures failed' }
          } finally { Remove-Item $fixture -ErrorAction SilentlyContinue }
  windows:
    if: inputs.run_id != '0'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_RUN: ${{ inputs.run_id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check merged source and CI provenance
        run: |
          if ($env:SOURCE_RUN -notmatch '^\d+$' -or $env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source run or commit' }
          $nativeRun = $env:SOURCE_RUN
          $reuseChecks = $false
          if ($env:SOURCE_RUN -eq '41279477891') {
            $nativeRun = '41279321946'
            $expectedTitle = "Windows x64 installer for $env:SOURCE_COMMIT"
            $prior = gh api "repos/$env:GH_REPO/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $prior.event -ne 'workflow_dispatch' -or $prior.display_title -ne $expectedTitle -or $prior.head_branch -ne 'build/windows-installer-20261101') { throw 'Prior build source does not match' }
            $jobs = gh api "repos/$env:GH_REPO/actions/runs/$env:SOURCE_RUN/jobs?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not read prior build checks' }
            $job = @($jobs.jobs | Where-Object { $_.name -eq 'windows' })
            if ($job.Count -ne 1) { throw 'Prior build job is missing or ambiguous' }
            foreach ($name in @('Check merged source and CI provenance', 'Verify checkout', 'Build pinned FFmpeg libraries', 'Check production build and focused regressions')) {
              $step = @($job[0].steps | Where-Object { $_.name -eq $name -and $_.conclusion -eq 'success' })
              if ($step.Count -ne 1) { throw "Prior check did not pass: $name" }
            }
            $probe = gh api "repos/$env:GH_REPO/actions/runs/41281614021" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $probe.event -ne 'workflow_dispatch' -or $probe.display_title -ne $expectedTitle -or $probe.head_branch -ne 'build/windows-installer-20261101' -or $probe.conclusion -ne 'success') { throw 'Installer fixture probe does not match' }
            $reuseChecks = $true
            Write-Host "Reusing successful exact-source focused checks from run $env:SOURCE_RUN; packaging and installation checks will run in this job."
          }
          $run = gh api "repos/$env:GH_REPO/actions/runs/$nativeRun" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $env:SOURCE_COMMIT -or $run.name -ne 'native-client' -or $run.event -ne 'push') { throw 'Native CI run does not match the merged source commit' }
          "NATIVE_CI_RUN=$nativeRun" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "REUSE_VALIDATED_CHECKS=$($reuseChecks.ToString().ToLower())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Verify checkout
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:SOURCE_COMMIT) { throw 'Source checkout mismatch' }
      - name: Prepare native build paths
        run: |
          $native = Join-Path $env:RUNNER_TEMP 'nuserein-installer-ffmpeg'
          "FFMPEG_DIR=$native/prefix" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_WORK=$native/build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_CACHE=$native/sources" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make pkgconf nasm diffutils
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - name: Install native packaging tools
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          python -m pip install meson==1.9.2 ninja==1.13.0
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg build tools installation failed' }
      - name: Restore the exact-source FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@v4.2.3
        with:
          path: |
            ${{ env.FFMPEG_DIR }}
            ${{ env.FFMPEG_CACHE }}
          key: nuserein-windows-x64-ffmpeg-${{ inputs.source_commit }}-v1
      - name: Build pinned FFmpeg libraries
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: python scripts/build-ffmpeg.py --prefix "$FFMPEG_DIR" --work-dir "$FFMPEG_WORK" --cache-dir "$FFMPEG_CACHE"
      - name: Save the exact-source FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4.2.3
        with:
          path: |
            ${{ env.FFMPEG_DIR }}
            ${{ env.FFMPEG_CACHE }}
          key: nuserein-windows-x64-ffmpeg-${{ inputs.source_commit }}-v1
      - name: Make native libraries available to build tests
        run: '"$env:FFMPEG_DIR/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Check production build and focused regressions
        if: env.REUSE_VALIDATED_CHECKS != 'true'
        run: |
          cargo check --locked -p serein --bin serein --no-default-features
          if ($LASTEXITCODE -ne 0) { throw 'Production build check failed' }
          cargo test --locked -p discord-gateway --lib presence
          if ($LASTEXITCODE -ne 0) { throw 'Gateway presence regressions failed' }
          cargo test --locked -p discord-voice --lib jitter::tests
          if ($LASTEXITCODE -ne 0) { throw 'Voice jitter regressions failed' }
      - name: Check packaging fixtures
        run: |
          python packaging/ffmpeg/test_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg packaging fixtures failed' }
          python packaging/windows/test_update_archive.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows update archive fixtures failed' }
          python -m unittest discover -s packaging/lavasr -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Speech packaging fixtures failed' }
          # The synthetic package contains placeholder CRT DLLs. Link its
          # throwaway process statically so those placeholders cannot prevent
          # Windows from loading it; the production executable is unchanged.
          $source = Get-Content -Raw packaging/windows/test_installer.py
          $before = '["rustc", "--edition=2024", "-O", str(fixture), "-o", str(payload / "serein.exe")]'
          $after = '["rustc", "--edition=2024", "-C", "target-feature=+crt-static", "-O", str(fixture), "-o", str(payload / "serein.exe")]'
          if (-not $source.Contains($before) -or $source.IndexOf($before) -ne $source.LastIndexOf($before)) { throw 'Installer fixture source changed unexpectedly' }
          $fixture = 'packaging/windows/installer-static-fixture.py'
          try {
            [IO.File]::WriteAllText((Join-Path (Get-Location) $fixture), $source.Replace($before, $after), [Text.UTF8Encoding]::new($false))
            python $fixture
            if ($LASTEXITCODE -ne 0) { throw 'Windows installer fixtures failed' }
          } finally { Remove-Item $fixture -ErrorAction SilentlyContinue }
      - name: Build the production package and installer
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Production source differs from the merged commit' }
          cargo xtask package
          if ($LASTEXITCODE -ne 0) { throw 'Production packaging failed' }
          $setup = @(Get-ChildItem dist-installer/*-setup.exe -File)
          if ($setup.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+([+-][A-Za-z0-9.-]+)?$') { throw 'Invalid package version' }
          $name = "NuSerein-$version-$($env:SOURCE_COMMIT.Substring(0,8))-Windows-X64-Setup.exe"
          Move-Item $setup[0].FullName "dist-installer/$name"
          Get-FileHash "dist-installer/$name" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $name" } | Set-Content dist-installer/SHA256SUMS.txt
          @{source_commit=$env:SOURCE_COMMIT; native_ci_run=$env:NATIVE_CI_RUN; focused_checks_run=$(if ($env:REUSE_VALIDATED_CHECKS -eq 'true') { $env:SOURCE_RUN } else { $env:GITHUB_RUN_ID }); architecture='X64'; rust='1.98.1'; signed=$false; installer_fixture='Synthetic process linked with static CRT; the original fixture timed out in run 41279477891'} | ConvertTo-Json | Set-Content dist-installer/build.json
      - name: Check the packaged runtime without build-library paths
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP 'nuserein-installer-check'
          New-Item -ItemType Directory -Path $checkDir -Force | Out-Null
          $archive = Join-Path $checkDir 'serein-v0.0.0-Windows-X64-media-v5.zip'
          Compress-Archive -Path 'dist/*' -DestinationPath $archive
          python packaging/windows/check_update_archive.py $archive
          if ($LASTEXITCODE -ne 0) { throw 'Windows media archive validation failed' }
          Expand-Archive $archive -DestinationPath "$checkDir/extracted"
          $buildPath = $env:PATH
          try {
            $nativeRoot = [IO.Path]::GetFullPath($env:FFMPEG_DIR).TrimEnd('\', '/')
            $env:PATH = ($buildPath -split ';' | Where-Object {
              try {
                $entry = [IO.Path]::GetFullPath($_).TrimEnd('\', '/')
                -not ($entry.Equals($nativeRoot, [StringComparison]::OrdinalIgnoreCase) -or $entry.StartsWith("$nativeRoot\", [StringComparison]::OrdinalIgnoreCase))
              } catch { $true }
            }) -join ';'
            $probe = Start-Process "$checkDir/extracted/serein.exe" -ArgumentList '--query-video-codec','nvenc','h264' -PassThru -Wait
            if ($probe.ExitCode -notin 0,1,2,5,9) { throw "Packaged codec probe failed: $($probe.ExitCode)" }
            $speech = Start-Process "$checkDir/extracted/serein.exe" -ArgumentList '--self-test-lavasr' -PassThru -Wait
            if ($speech.ExitCode -ne 0) { throw "Packaged LavaSRv2 worker failed: $($speech.ExitCode)" }
          } finally { $env:PATH = $buildPath }
      - name: Install silently and verify every payload file
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'NuSerein installer smoke'
          $setup = Get-ChildItem dist-installer/*-Setup.exe -File
          $process = Start-Process -FilePath $setup.FullName -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installation failed: $($process.ExitCode)" }
          $env:INSTALLED_PAYLOAD = $install
          @'
          import hashlib, os, struct
          from pathlib import Path
          source, installed = Path('dist'), Path(os.environ['INSTALLED_PAYLOAD'])
          assert (source / 'serein.exe').is_file()
          for binary in [source / 'serein.exe', *sorted(source.rglob('*.dll'))]:
              data = binary.read_bytes()
              offset = struct.unpack_from('<I', data, 0x3c)[0]
              assert data[:2] == b'MZ' and data[offset:offset+4] == b'PE\0\0', str(binary)
              assert struct.unpack_from('<H', data, offset+4)[0] == 0x8664, str(binary)
          count = 0
          for path in source.rglob('*'):
              if path.is_file() and path.name not in ('setup.ps1', 'install-notifications.ps1'):
                  actual = installed / path.relative_to(source)
                  assert actual.is_file(), str(actual)
                  assert hashlib.sha256(path.read_bytes()).digest() == hashlib.sha256(actual.read_bytes()).digest(), str(actual)
                  count += 1
          assert (installed / 'uninstall.exe').is_file()
          print(f'Installer smoke passed: {count} matching payload files and x64 PE binaries')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Installed payload verification failed' }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: NuSerein-Windows-X64-installer
          path: dist-installer/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve FFmpeg diagnostics on failure
        if: failure() && env.FFMPEG_WORK != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NuSerein-Windows-X64-build-diagnostics
          path: ${{ env.FFMPEG_WORK }}/**/ffbuild/config.log
          if-no-files-found: ignore
          retention-days: 7
