name: Upload verified NuSerein nightly assets
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Verified native CI run
        required: true
      source_commit:
        description: Exact packaged source commit
        required: true
permissions:
  contents: read
jobs:
  upload-verified-draft:
    if: github.repository == 'MCShotty/NuSerein'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and upload assets to the release draft
        run: python3 .github/release/upload-verified-draft.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-release-evidence
          path: |
            release-assets/BUILDINFO.json
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
