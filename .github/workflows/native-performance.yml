name: Nightly native performance comparison

on:
  push:
    branches: [ci/pr567-native-performance-20261013]

permissions:
  contents: read

concurrency:
  group: nightly-native-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      BASELINE_SHA: cc0987e2d4505bdfb780045327bb14c3b0c0928e
      CANDIDATE_SHA: 8a1ab4a2014c6660c86f8009407f396c36571480
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: 1.98.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out measurement tooling
        uses: actions/checkout@v7.0.1
        with:
          path: measurement
          persist-credentials: false
      - name: Check out the current published nightly
        uses: actions/checkout@v7.0.1
        with:
          repository: ViceVerse-cz/Serein
          ref: ${{ env.BASELINE_SHA }}
          path: nightly
          persist-credentials: false
      - name: Check out the PR revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: macOS native build tools
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config meson ninja
      - name: Windows installer tools
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MSYS
          path-type: inherit
          install: make pkgconf nasm diffutils
      - name: Windows decoder build tools
        if: runner.os == 'Windows'
        run: python -m pip install meson==1.9.2 ninja==1.13.0
      - name: Prepare isolated native build paths
        run: python measurement/scripts/measure-native-nightly.py --prepare
      - name: Build the PR's private FFmpeg libraries
        if: runner.os == 'macOS'
        working-directory: candidate
        run: python scripts/build-ffmpeg.py --prefix "$FFMPEG_DIR" --work-dir "$FFMPEG_WORK" --cache-dir "$FFMPEG_CACHE"
      - name: Build the PR's private FFmpeg libraries (MSVC)
        if: runner.os == 'Windows'
        working-directory: candidate
        shell: msys2 {0}
        run: python scripts/build-ffmpeg.py --prefix "$FFMPEG_DIR" --work-dir "$FFMPEG_WORK" --cache-dir "$FFMPEG_CACHE"
      - name: Build matching release packages and measure paired replay
        run: python measurement/scripts/measure-native-nightly.py
      - name: Preserve the exact comparison results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nightly-comparison-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/native-comparison-evidence/*.json
          if-no-files-found: error
          retention-days: 14
